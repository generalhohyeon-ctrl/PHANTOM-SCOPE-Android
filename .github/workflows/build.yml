
name: Build PHANTOM SCOPE APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract 0.9.4 project
        run: |
          mkdir -p extracted
          unzip -o PHANTOM_SCOPE_0.6_GitHub_Ready.zip -d extracted

      - name: Build APK
        run: |
          gradle -p extracted/PHANTOM_SCOPE_0.6_GitHub_Ready.zip assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: phantom-scope-0.9.4-apk
          path: extracted/PHANTOM_SCOPE_0.6_GitHub_Ready.zip/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
