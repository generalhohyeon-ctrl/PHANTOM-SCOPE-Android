
name: Build PHANTOM SCOPE APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Android project
        run: |
          find "$GITHUB_WORKSPACE" -type f -name '*.zip' \
            -not -path '*/.git/*' \
            -exec unzip -o {} -d "$GITHUB_WORKSPACE/extracted" \;

      - name: Find Android project
        run: |
          PROJECT_DIR=$(find "$GITHUB_WORKSPACE" \
            -type f \( -name settings.gradle.kts -o -name settings.gradle \) \
            -not -path '*/.gradle/*' \
            -not -path '*/.git/*' \
            -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "Android project not found!"
            find "$GITHUB_WORKSPACE" -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found: $PROJECT_DIR"

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: phantom-scope-debug-apk
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: error
