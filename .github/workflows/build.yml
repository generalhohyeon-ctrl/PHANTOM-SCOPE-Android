name: Build PHANTOM SCOPE APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Android project
        run: unzip -q PHANTOM_SCOPE_Android_0.9.4_recovery.zip -d source

      - name: Build APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.9'
          arguments: assembleDebug
          build-root-directory: source/PHANTOM_SCOPE_Android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PHANTOM-SCOPE-APK
          path: source/PHANTOM_SCOPE_Android/app/build/outputs/apk/debug/app-debug.apk
