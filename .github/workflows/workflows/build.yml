name: Build PHANTOM SCOPE APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Extract Android project
        run: unzip -q PHANTOM_SCOPE_Android_0.6_Project.zip -d source
      - name: Build debug APK
        working-directory: source/PHANTOM_SCOPE_Android
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: phantom-scope-debug-apk
          path: source/PHANTOM_SCOPE_Android/app/build/outputs/apk/debug/app-debug.apk
